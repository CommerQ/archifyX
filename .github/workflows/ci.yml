name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Package smoke (self-contained)
        run: node scripts/package-smoke.mjs
      - name: Atlas smoke
        run: node archifyX/test/atlas-smoke.mjs
      - name: Demo build
        run: node archifyX/bin/archifyX.mjs demo examples/demo-out
