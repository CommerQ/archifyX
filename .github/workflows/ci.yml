name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 18/20 EOL on Actions runners — test current LTS + active.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: Package smoke (self-contained + pack)
        run: node scripts/package-smoke.mjs
      - name: Atlas smoke
        run: node archifyX/test/atlas-smoke.mjs
      - name: Demo build
        run: node archifyX/bin/archifyX.mjs demo examples/demo-out

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Canonical ZIP bytes depend on Node/zlib major; keep on 22.
          node-version: 22
      - name: Release identity
        run: node scripts/check-release-identity.mjs
      - name: Canonical ZIP (Node 22)
        run: node scripts/build-zip.mjs
      - name: Upload archifyX.zip
        uses: actions/upload-artifact@v5
        with:
          name: archifyX-zip
          path: archifyX.zip
